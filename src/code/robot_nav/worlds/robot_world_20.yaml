world:
  height: 20
  width: 20
  step_time: 0.3
  sample_time: 0.3
  collision_mode: 'reactive'

robot:
  - kinematics: {name: 'diff'}
    shape: {name: 'circle', radius: 0.2}
    vel_min: [0, -1.0]
    vel_max: [1.0, 1.0]
    state: [2, 2, 0, 0]
    goal: [18, 18, 0]
    arrive_mode: position
    goal_threshold: 0.3
    sensors:
      - type: 'lidar2d'
        range_min: 0
        range_max: 10
        angle_range: 3.14
        number: 100
        noise: True
        std: 0.08
        angle_std: 0.1
        offset: [0, 0, 0]
        alpha: 0.3
    plot:
      show_trajectory: True

obstacle:
  - number: 6
    kinematics: {name: 'omni'}
    distribution: {name: 'random', range_low: [1, 1, -3.14], range_high: [19, 19, 3.14]}
    behavior: {name: 'rvo', wander: True, range_low: [0,0,-3.14], range_high: [20,20,3.14], vxmax: 0.3, vymax: 0.3, factor: 1.0}
    vel_max: [0.3, 0.3]
    vel_min: [-0.3, -0.3]
    shape:
      - {name: 'circle', radius: 0.8, random_shape: True}
      - {name: 'polygon', random_shape: true, avg_radius_range: [0.5, 1.2], irregularity_range: [0, 0.4], spikeyness_range: [0, 0.4], num_vertices_range: [4, 6]}
  - shape: {name: 'circle', radius: 1.0}
    state: [10, 5, 0]
    kinematics: {name: 'static'}
  - shape: {name: 'rectangle', length: 1.5, width: 0.5}
    state: [5, 15, 0.8]
    kinematics: {name: 'static'}
  - shape: {name: 'linestring', vertices: [[0,0],[20,0],[20,20],[0,20],[0,0]]}
    kinematics: {name: 'static'}
    state: [0, 0, 0]
