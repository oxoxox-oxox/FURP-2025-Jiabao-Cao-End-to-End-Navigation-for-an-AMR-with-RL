world:
  height: 10
  width: 10
  step_time: 0.3
  sample_time: 0.3
  collision_mode: 'reactive'
robot:
  - kinematics: {name: 'diff'}
    shape: {name: 'circle', radius: 0.2}
    vel_min: [0, -1.0]
    vel_max: [1.0, 1.0]
    state: [1.0, 5.0, 0, 0]
    goal: [9.0, 5.0, 0]
    arrive_mode: position
    goal_threshold: 0.3
    sensors:
      - type: 'lidar2d'
        range_min: 0
        range_max: 7
        angle_range: 3.14
        number: 180
        noise: True
        std: 0.08
        angle_std: 0.1
        offset: [0, 0, 0]
        alpha: 0.3
    plot:
      show_trajectory: True
obstacle:
  # 走廊宽2.0m（上壁y=6，下壁y=4），测试是否走廊变宽就能通过
  - shape: {name: 'linestring', vertices: [[1,6],[9,6]]}
    kinematics: {name: 'static'}
    state: [0,0,0]
  - shape: {name: 'linestring', vertices: [[1,4],[9,4]]}
    kinematics: {name: 'static'}
    state: [0,0,0]
  - shape: {name: 'linestring', vertices: [[0,0],[10,0],[10,10],[0,10],[0,0]]}
    kinematics: {name: 'static'}
    state: [0,0,0]
