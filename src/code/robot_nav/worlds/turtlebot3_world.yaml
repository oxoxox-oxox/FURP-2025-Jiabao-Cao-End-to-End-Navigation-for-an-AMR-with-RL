world:
  height: 10
  width: 10
  step_time: 0.1
  sample_time: 0.1
  collision_mode: 'reactive'

robot:
  - kinematics: {name: 'diff'}
    shape: {name: 'circle', radius: 0.18}  # TurtleBot3 Burger 半径约0.18m
    vel_min: [0, -2.84]                     # Burger 角速度范围
    vel_max: [0.22, 2.84]                   # Burger 最大线速度 0.22 m/s
    state: [3, 4, 0, 0]
    goal: [9, 9, 0]
    arrive_mode: position
    goal_threshold: 0.3
    sensors:
      - type: 'lidar2d'
        range_min: 0.05                     # RPLIDAR C1 最小距离
        range_max: 7                        # 裁剪到7m（和原训练一致）
        angle_range: 3.14                   # 取前180度
        number: 180                         # 下采样到180个点
        noise: True
        std: 0.03                           # RPLIDAR C1 精度 ±30mm
        angle_std: 0.01
        offset: [0, 0, 0]
        alpha: 0.3
    plot:
      show_trajectory: True

obstacle:
  - number: 4
    distribution:
      name: random
      range_low: [0, 0, -3.14]
      range_high: [10, 10, 3.14]
    state: [[5, 5, 0], [7, 8, 0], [3, 1, 0], [8, 5, 1]]
    shape:
      - {name: 'circle', radius: 1.0, random_shape: True}
      - {name: 'circle', radius: 1.0, random_shape: True}
      - {name: 'circle', radius: 1.0, random_shape: True}
      - {name: 'circle', radius: 1.0, random_shape: True}
    kinematics: {name: 'omni'}
    vel_max: [0.2, 0.2]
    vel_min: [-0.2, -0.2]
  - shape: {name: 'circle', radius: 0.8}
    state: [5, 5, 0]
    kinematics: {name: 'static'}
  - shape: {name: 'rectangle', length: 1.0, width: 1.2}
    state: [8, 5, 1]
    kinematics: {name: 'static'}
  - shape: {name: 'rectangle', length: 0.5, width: 2.1}
    state: [1, 8, 1.3]
    kinematics: {name: 'static'}
  - shape: {name: 'linestring', vertices: [[0,0],[10,0],[10,10],[0,10],[0,0]]}
    kinematics: {name: 'static'}
    state: [0, 0, 0]
