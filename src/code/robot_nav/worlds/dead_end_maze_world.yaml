world:
  height: 10
  width: 10
  step_time: 0.3
  sample_time: 0.3
  collision_mode: 'reactive'

robot:
  - kinematics: {name: 'diff'}
    shape: {name: 'circle', radius: 0.2}
    vel_min: [0, -1.0]
    vel_max: [1.0, 1.0]
    # agent在左侧小房间里，朝右，正对着死路走廊入口
    state: [1.5, 8.0, 0, 0]
    goal: [9.0, 5.0, 0]
    arrive_mode: position
    goal_threshold: 0.3
    sensors:
      - type: 'lidar2d'
        range_min: 0
        range_max: 7
        angle_range: 3.14
        number: 180
        noise: True
        std: 0.08
        angle_std: 0.1
        offset: [0, 0, 0]
        alpha: 0.3
    plot:
      show_trajectory: True

obstacle:
  # 结构（俯视）：
  #
  # y=10 ┌──────────────────────────────┐
  #      │ agent(1.5,8)                 │
  # y=6.5├──────┬─[上死路 y=6.5~9]──X  │
  #      │      │ ← agent直接面对死路   │
  # y=5.5│      ├─[中走廊 y=4.5~6.5]──→goal
  #      │      │                       │
  # y=4.5│      ├─[下死路 y=1~4.5]──X  │
  # y=1  └──────┴──────────────────────-┘
  #       x=0  x=3                  x=9

  # ── 选择墙(x=3)：只留三个走廊入口，间距相近让agent难以判断 ──
  - shape: {name: 'linestring', vertices: [[3,0],[3,4.5]]}
    kinematics: {name: 'static'}
    state: [0,0,0]
  - shape: {name: 'linestring', vertices: [[3,5.5],[3,6.5]]}
    kinematics: {name: 'static'}
    state: [0,0,0]
  - shape: {name: 'linestring', vertices: [[3,7.5],[3,10]]}
    kinematics: {name: 'static'}
    state: [0,0,0]

  # ── 上死路走廊 (y=7.5~9.5, x=3~8) ──
  - shape: {name: 'linestring', vertices: [[3,9.5],[8,9.5]]}
    kinematics: {name: 'static'}
    state: [0,0,0]
  - shape: {name: 'linestring', vertices: [[3,7.5],[8,7.5]]}
    kinematics: {name: 'static'}
    state: [0,0,0]
  - shape: {name: 'linestring', vertices: [[8,7.5],[8,9.5]]}
    kinematics: {name: 'static'}
    state: [0,0,0]

  # ── 中间走廊 (y=5.5~6.5, x=3~9.5)，通向goal(9,6) ──
  - shape: {name: 'linestring', vertices: [[3,6.5],[9.5,6.5]]}
    kinematics: {name: 'static'}
    state: [0,0,0]
  - shape: {name: 'linestring', vertices: [[3,5.5],[9.5,5.5]]}
    kinematics: {name: 'static'}
    state: [0,0,0]
  # 右侧不封口

  # ── 下死路走廊 (y=0.5~4.5, x=3~8) ──
  - shape: {name: 'linestring', vertices: [[3,4.5],[8,4.5]]}
    kinematics: {name: 'static'}
    state: [0,0,0]
  - shape: {name: 'linestring', vertices: [[3,0.5],[8,0.5]]}
    kinematics: {name: 'static'}
    state: [0,0,0]
  - shape: {name: 'linestring', vertices: [[8,0.5],[8,4.5]]}
    kinematics: {name: 'static'}
    state: [0,0,0]

  # ── 世界边界 ──
  - shape: {name: 'linestring', vertices: [[0,0],[10,0],[10,10],[0,10],[0,0]]}
    kinematics: {name: 'static'}
    state: [0,0,0]
