world:
  height: 10
  width: 10
  step_time: 0.3
  sample_time: 0.3
  collision_mode: 'reactive'
robot:
  - kinematics: {name: 'diff'}
    shape: {name: 'circle', radius: 0.2}
    vel_min: [0, -1.0]
    vel_max: [1.0, 1.0]
    state: [2.0, 5.0, 0, 0]
    goal: [8.0, 5.0, 0]
    arrive_mode: position
    goal_threshold: 0.3
    sensors:
      - type: 'lidar2d'
        range_min: 0
        range_max: 7
        angle_range: 3.14
        number: 180
        noise: True
        std: 0.08
        angle_std: 0.1
        offset: [0, 0, 0]
        alpha: 0.3
    plot:
      show_trajectory: True
obstacle:
  - shape: {name: 'linestring', vertices: [[5,0],[5,4.5]]}
    kinematics: {name: 'static'}
    state: [0,0,0]
  - shape: {name: 'linestring', vertices: [[5,5.5],[5,10]]}
    kinematics: {name: 'static'}
    state: [0,0,0]
  - shape: {name: 'linestring', vertices: [[0,0],[10,0],[10,10],[0,10],[0,0]]}
    kinematics: {name: 'static'}
    state: [0,0,0]
