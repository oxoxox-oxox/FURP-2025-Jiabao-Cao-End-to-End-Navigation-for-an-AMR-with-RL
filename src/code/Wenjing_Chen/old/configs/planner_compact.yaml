# NeuPAN planner config for 10x10m compact scenes
# 匹配 CNNTD3 的机器人尺寸和场景设置
receding: 10
step_time: 0.3          # 跟ir-sim一致
ref_speed: 0.5          # 跟CNNTD3推理时限速一致
device: 'cpu'
time_print: False
collision_threshold: 0.1

robot:
  kinematics: 'diff'
  max_speed: [0.5, 1.0]    # 跟CNNTD3一致: lin 0.5, ang 1.0
  max_acce: [1.0, 2.0]
  length: 0.4              # 机器人radius=0.2, diameter=0.4
  width: 0.4

ipath:
  waypoints: [[7.5, 5, 0], [9, 5, 0]]   # 会被代码覆盖
  curve_style: 'line'
  min_radius: 0.5
  loop: False
  arrive_threshold: 0.3
  close_threshold: 0.1
  ind_range: 10
  arrive_index_threshold: 1

pan:
  iter_num: 2
  dune_max_num: 100
  nrmp_max_num: 10
  iter_threshold: 0.1
  dune_checkpoint: 'example/model/diff_robot_default/model_5000.pth'

adjust:
  q_s: 1.0
  p_u: 1.0
  eta: 15.0
  d_max: 0.35           # 关键！从1.0降到0.35（仅比机器人半径大0.15m）
  d_min: 0.1            # 碰撞距离
