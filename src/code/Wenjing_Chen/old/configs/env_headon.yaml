world:
  height: 30
  width: 70
  step_time: 0.1
  sample_time: 0.1
  offset: [-5, 5]
  collision_mode: 'stop'
  control_mode: 'auto'

robot:
  - kinematics: {name: 'diff'}
    shape: {name: 'rectangle', length: 1.6, width: 2.0}
    state: [-5, 20, 0]
    goal: [55, 20, 0]
    vel_min: [-8, -3.14]
    vel_max: [8, 3.14]
    goal_threshold: 1.0
    plot:
      show_trail: True
      show_goal: True
      show_trajectory: False
    sensors:
      - type: 'lidar2d'
        range_min: 0
        range_max: 10
        angle_range: 3.1415926
        number: 100
        noise: False

obstacle:
  # ===== 静态：走廊墙 + 转弯障碍 =====
  - number: 3
    distribution: {name: 'manual'}
    shape:
      - {name: 'rectangle', length: 70, width: 2}
      - {name: 'rectangle', length: 70, width: 2}
      - {name: 'rectangle', length: 7, width: 2}
    state: [[30, 27, 0], [30, 13, 0], [10, 18, 1.57]]

  # ===== 主威胁：迎面球（沿走廊轴线水平往返，正对机器人来路） =====
  # 致命几何：闭合速度 = 4(机器人) + 1.8(球) = 5.8 m/s
  #   延迟1s → 机器人看到的球在真实位置后方1.8m（以为余量更大）→ 反应迟半拍
  # 三条水平巡逻道：y=17.5 / 20(正中) / 22.5，x∈[22, 54] 往返
  - number: 3
    distribution: {name: 'manual'}
    kinematics: {name: 'diff'}
    shape:
      - {name: 'circle', radius: 0.7}
      - {name: 'circle', radius: 0.7}
      - {name: 'circle', radius: 0.7}
    state:
      - [50.0, 20.0, 3.14]    # 正中道，起手正对机器人开过来
      - [44.0, 17.5, 3.14]    # 下道
      - [54.0, 22.5, 3.14]    # 上道
    behavior:
      - {name: 'dash', range_low: [22, 19.6, -3.14], range_high: [54, 20.4, 3.14], wander: True, vxmax: 1.8, vymax: 1.8}
      - {name: 'dash', range_low: [22, 17.1, -3.14], range_high: [54, 17.9, 3.14], wander: True, vxmax: 1.8, vymax: 1.8}
      - {name: 'dash', range_low: [22, 22.1, -3.14], range_high: [54, 22.9, 3.14], wander: True, vxmax: 1.8, vymax: 1.8}
    vel_min: [-2.0, -3.14]
    vel_max: [2.0, 3.14]
    arrive_mode: position
    goal_threshold: 0.3
    plot:
      show_goal: False
      show_arrow: True

  # ===== 辅威胁：竖穿球（x=38处一条，制造侧向干扰） =====
  - number: 1
    distribution: {name: 'manual'}
    kinematics: {name: 'diff'}
    shape:
      - {name: 'circle', radius: 0.7}
    state:
      - [38.0, 24.0, -1.57]
    behavior:
      - {name: 'dash', range_low: [37.5, 15, -3.14], range_high: [38.5, 24.5, 3.14], wander: True, vxmax: 1.8, vymax: 1.8}
    vel_min: [-2.0, -3.14]
    vel_max: [2.0, 3.14]
    arrive_mode: position
    goal_threshold: 0.3
    plot:
      show_goal: False
      show_arrow: True
