world:
  height: 30
  width: 70
  step_time: 0.1
  sample_time: 0.1
  offset: [-5, 5]
  collision_mode: 'stop'
  control_mode: 'auto'

robot:
  - kinematics: {name: 'diff'} 
    shape: {name: 'rectangle', length: 1.6, width: 2.0}
    state: [-5, 20, 0]
    goal: [55, 20, 0]
    vel_min: [-8, -3.14]
    vel_max: [8, 3.14]
    goal_threshold: 1.0
    plot:
      show_trail: True
      show_goal: True
      show_trajectory: False
    sensors: 
      - type: 'lidar2d'
        range_min: 0
        range_max: 10
        angle_range: 3.1415926
        number: 100
        noise: False

obstacle:
  # 静态墙壁
  - number: 3
    distribution: {name: 'manual'}
    shape:
      - {name: 'rectangle', length: 70, width: 2}
      - {name: 'rectangle', length: 70, width: 2}
      - {name: 'rectangle', length: 7, width: 2}
    state: [[30, 27, 0], [30, 13, 0], [10, 18, 1.57]]

  # 动态障碍物（在走廊内随机移动）
  - number: 5
    distribution: {name: 'random', range_low: [15, 15, -3.14], range_high: [50, 25, 3.14]}
    kinematics: {name: 'diff'}
    shape:
      - {name: 'circle', radius: 0.5}
      - {name: 'circle', radius: 0.6}
      - {name: 'circle', radius: 0.4}
      - {name: 'circle', radius: 0.5}
      - {name: 'circle', radius: 0.7}
    behavior: 
      - {name: 'rvo', range_low: [5, 14, -3.14], range_high: [55, 26, 3.14], wander: True, vxmax: 0.5, vymax: 0.5}
    vel_min: [-1.0, -3.14]
    vel_max: [1.0, 3.14]
    arrive_mode: position
    goal_threshold: 0.3
    plot:
      show_goal: False
      show_arrow: True
