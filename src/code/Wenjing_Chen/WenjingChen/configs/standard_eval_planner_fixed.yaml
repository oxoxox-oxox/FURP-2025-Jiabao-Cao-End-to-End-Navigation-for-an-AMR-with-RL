receding: 10
step_time: 0.3
ref_speed: 0.5          # 原来1.5，改为0.5（TurtleBot3 max=0.22，仿真留余量）
device: 'cpu'
time_print: False
collision_threshold: 0.2
robot:
  kinematics: 'diff'
  max_speed: [1.0, 1.0]  # 原来[1.0, 3.14]，角速度对齐env.yaml的vel_max
  max_acce: [2.0, 3.14]
  length: 0.4            # NeuPAN内部用矩形规划，但radius=0.2→length=width=0.4是外接矩形
  width: 0.4             # 保持不变（已与env.yaml的circle radius=0.2对应）
ipath:
  waypoints: [[3, 4, 0], [9, 9, 0]]
  curve_style: 'line'
  min_radius: 1.0
  loop: False
  arrive_threshold: 0.3  # 与env.yaml的goal_threshold: 0.3一致
  close_threshold: 0.1
  ind_range: 10
  arrive_index_threshold: 1
pan:
  iter_num: 2
  dune_max_num: 100
  nrmp_max_num: 10
  iter_threshold: 0.1
  dune_checkpoint: 'example/model/diff_robot_default/model_5000.pth'
adjust:
  q_s: 1.0
  p_u: 1.0
  eta: 15.0
  d_max: 1.0
  d_min: 0.2
