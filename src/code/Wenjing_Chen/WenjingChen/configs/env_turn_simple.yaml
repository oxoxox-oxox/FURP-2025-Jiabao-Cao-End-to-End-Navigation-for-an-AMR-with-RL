world:
  height: 30
  width: 70
  step_time: 0.1
  sample_time: 0.1
  offset: [-3, 5]
  collision_mode: 'stop'
  control_mode: 'auto'

robot:
  - kinematics: {name: 'diff'} 
    shape: {name: 'rectangle', length: 1.6, width: 2.0}
    state: [-5, 20, 0] 
    goal: [60, 20, 0] 
    vel_min: [-8, -3.14]
    vel_max: [8, 3.14]
    goal_threshold: 0.5
    plot:
      show_trail: True
      show_goal: True
      show_trajectory: False
    sensors: 
      - type: 'lidar2d'
        range_min: 0
        range_max: 10
        angle_range: 3.1415926
        number: 100
        noise: False

obstacle:
  - number: 3
    distribution: {name: 'manual'}
    shape:
      - {name: 'rectangle', length: 70, width: 2}
      - {name: 'rectangle', length: 70, width: 2}
      - {name: 'rectangle', length: 7, width: 2}
    state: [[30, 27, 0], [30, 13, 0], [10, 18, 1.57]]
